<div class="slideshow-container flex-grow-1">

  <div class="slideshow-images">
    <ng-container *ngFor="let img of images; let i = index">
      <img *ngIf="i === currentIndex"
           [src]="img"
           @fade
           class="slide-image"
           alt="Homepage Slideshow">
    </ng-container>
  </div>
  <div class="slideshow-overlay-text">
    <div class="py-3 w-50 ms-5 mt-2">
      <h1 @fade class="home-text">Charting new horizons...</h1>
    </div>
    <div class="w-50 ms-5 ps-3">
      <h1 @fade class="home-text">...together.</h1>
    </div>
  </div>
</div>
