<div class="hero-section flex-grow-1">
  <div class="container py-5 primary-text">
    <div>
      @if(!token) {
      <div>
        <p>This password reset link is missing its token.</p>
        <p>Please request a new password reset email.</p>
      </div>
      } @else {
      <h1>New Password</h1>
      <form [formGroup]="model" (ngSubmit)="submitRequest()" class="p-5">
        <div class="mb-3 row justify-content-center">
          <input class="col-lg-6" id="password"
                 type="password"
                 formControlName="password"
                 placeholder="Enter New Password"
                 required>
        </div>
        @if (responseMsg) {
        <div class="mb-3 justify-content-center">
          {{responseMsg}}
        </div>
        }
        <div class="actions row justify-content-center">
          <!-- disabled unless the form passes all your Validators.required checks -->
          <button class="col-lg-6 user-menu-button" type="submit" [disabled]="model.invalid || confirming">Submit</button>
        </div>
      </form>
      }
    </div>
  </div>
</div>
