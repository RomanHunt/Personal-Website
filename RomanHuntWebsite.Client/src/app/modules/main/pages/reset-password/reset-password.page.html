<div class="hero-section flex-grow-1">
  <div class="container py-5 primary-text">
    <div>
      @if(!token) {
      <div>
        <p>This password reset link is missing its token.</p>
        <p>Please request a new password reset email.</p>
      </div>
      } @else {
      <h1 class="text-center">Reset Account Password</h1>
      <form [formGroup]="model" (ngSubmit)="submitRequest()" class="p-5">
        <div class="mb-3 row justify-content-center">
          <label class="col-lg-4" for="confirmPassword">Confirm Password</label>
          <input class="col-lg-7" id="password"
                 [type]="hidePassword() ? 'password' : 'text'"
                 formControlName="password"
                 placeholder="Enter New Password"
                 required>
          <button class="col-lg-1 secondary-background primary-text" type="button" (click)="togglePassword()">
            <i class="fa" [ngClass]="hidePassword() ? 'fa-eye-slash' : 'fa-eye'"></i>
          </button>
        </div>
        <div class="mb-3 row">
          <label class="col-lg-4" for="confirmPassword">Confirm Password</label>
          <input class="col-lg-8 user-input" id="confirmPassword"
                 type="password"
                 formControlName="confirmPassword"
                 placeholder="Confirm Password"
                 required>
        </div>
        <div class="text-center">
          Passwords must have at least 12 characters.
        </div>

        @if (responseMsg) {
        <div class="mb-3 justify-content-center">
          {{responseMsg}}
        </div>
        }
        <div class="actions row justify-content-center">
          <!-- disabled unless the form passes all your Validators.required checks -->
          <button class="col-lg-6 user-menu-button" type="submit" [disabled]="model.invalid || confirming">Submit</button>
        </div>
      </form>
      }
    </div>
  </div>
</div>
