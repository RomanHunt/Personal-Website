<dialog #dialogElement (cancel)="$event.preventDefault(); close()" class="user-modal">

  <div class="d-flex">
    <button type="button" class="fa-solid fa-x ms-auto close-x" (click)="close()" aria-label="Close"></button>
  </div>
  <h2>New User</h2>

  <form [formGroup]="model" (ngSubmit)="submitRequest()" class="p-5">
    <div class="mb-5 row">
        <label class="col-lg-4" for="userName">Username</label>
        <input class="col-lg-8 user-input" id="userName"
               type="text"
               formControlName="userName"
               placeholder="Enter Username"
               required>
    </div>
    <div class="mb-5 row">
      <label class="col-lg-4" for="email">Email Address</label>
      <input class="col-lg-8 user-input" id="email"
             type="email"
             formControlName="email"
             placeholder="Enter Email Address"
             required>
    </div>

    <div class="mb-5 row">
      <label class="col-lg-4" for="password">Password</label>
      <input class="col-lg-8 user-input" id="password"
             type="password"
             formControlName="password"
             placeholder="Enter Password"
             required>
    </div>

    @if (errorMsg) {
    <div class="mb-3" style="color:orange">
      {{errorMsg}}
    </div>
    }

    <div class="actions row">
      <!-- type="button" prevents it from accidentally submitting the form -->
      <button class="col-lg-4 mt-5 user-menu-button" type="button" (click)="close()">Close</button>
      <!-- disabled unless the form passes all your Validators.required checks -->
      <button class="col-lg-4 mt-5 ms-auto user-menu-button" type="submit" [disabled]="model.invalid">Submit</button>
    </div>
  </form>
</dialog>
